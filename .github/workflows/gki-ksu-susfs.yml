name: Universal GKI Kernel Builder CI
run-name: "Build Custom GKI: ${{ inputs.build_name }} [${{ github.ref_name }}]"
on:
  workflow_dispatch:
    inputs:
      build_channel:
        description: 'Build Channel'
        required: false
        type: choice
        options:
          - stable
          - dynamic

      build_name:
        description: "Build Name"
        required: true
        type: string

      target_version:
        description: "Kernel Version"
        required: true
        type: string

      root_manager:
        description: "Root Environment"
        required: false
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra
          - BakaSU
          - ReSukiSU
          - KernelSU
          - Stock

      enable_ksu_susfs:
        description: "Integrate Root Manager and SUSFS?"
        required: false
        type: boolean
        default: true
        
      enable_nomount:
        description: "Inject nomount VFS module"
        required: false
        type: boolean
        default: false
        
      enable_net_opts:
        description: "Inject Network Optimizations (BBR, CAKE, FastOpen, ECN)"
        required: false
        type: boolean
        default: false
        
      enable_nethunter:
        description: "Inject Kali NetHunter Core"
        required: false
        type: boolean
        default: false
        
      ota_url:
        description: "Full OTA ZIP URL (blank produces AK3 zip)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  OTA_URL: ${{ inputs.ota_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Evaluate OTA URL for payload.bin compatibility
        run: |
          sudo apt-get install -qq -y python3-venv > /dev/null
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -q requests remotezip
          echo "========================================"
          echo "        OTA VALIDATION RESULT           "
          echo "========================================"
          python3 scripts/validate_ota.py
          echo "========================================"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Create Manual 16GB Swap File
        run: |
          echo "=== Freeing up any existing partial swap ==="
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi

          echo "=== Allocating 16GB Swap ==="
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Verified Memory Configuration ==="
          free -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Manifest Branch from Database
        id: resolve_manifest
        run: |
          TARGET_RAW="${{ inputs.target_version }}"
          echo ">>> Raw input received: $TARGET_RAW"

          # 1. DIRECT OVERRIDE BYPASS (For Vendor Trees like gs-caimito)
          if [[ "$TARGET_RAW" == android-gs-* ]] || [[ "$TARGET_RAW" == common-* ]]; then
              echo ">>> Direct Google Git branch detected! Bypassing database resolution..."
              MANIFEST_BRANCH="$TARGET_RAW"
              
              # Extract the base version (e.g., '6.1') from the branch string
              BASE_VER=$(echo "$TARGET_RAW" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
              echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
          else
              # 2. STANDARD GKI VERSION PARSING
              TARGET=$(echo "$TARGET_RAW" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)

              if [ -z "$TARGET" ]; then
                  echo "[-] Error: Could not extract a valid kernel version from the input."
                  exit 1
              fi

              echo ">>> Clean Target Version extracted: $TARGET"
              BASE_VER=$(echo "$TARGET" | cut -d. -f1,2)
              DB_FILE="tools/master_kernel_db.json"
              MANIFEST_BRANCH=""
                 
              echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
              
              if [ -f "$DB_FILE" ]; then
                  echo ">>> Querying $DB_FILE for branch match..."
                  JSON_RESULT=$(jq -r ".[\"$BASE_VER\"][] | select(.kernel == \"$TARGET\")" "$DB_FILE" 2>/dev/null || true)

                  if [ -n "$JSON_RESULT" ]; then
                      A_VER=$(echo "$JSON_RESULT" | jq -r '.android_version')
                      K_DATE=$(echo "$JSON_RESULT" | jq -r '.date')
                      MANIFEST_BRANCH="common-${A_VER}-${BASE_VER}-${K_DATE}"
                      echo ">>> Precise match found in DB!"
                  fi
              else
                  echo "[-] Warning: Database file $DB_FILE not found in the repository."
              fi

              if [ -z "$MANIFEST_BRANCH" ]; then
                  echo "[-] Exact version not mapped. Defaulting to standard LTS branch..."
                  case "$BASE_VER" in
                      "5.10") ANDROID_VER="android12" ;;
                      "5.15") ANDROID_VER="android13" ;;
                      "6.1")  ANDROID_VER="android14" ;;
                      "6.6")  ANDROID_VER="android15" ;;
                      "6.12") ANDROID_VER="android16" ;;
                      "6.18") ANDROID_VER="android17" ;;
                      *)
                          echo "[-] Error: Unsupported base version $BASE_VER."
                          exit 1
                          ;;
                  esac
                  MANIFEST_BRANCH="common-${ANDROID_VER}-${BASE_VER}-lts"
              fi
          fi

          echo ">>> Target Branch successfully resolved: $MANIFEST_BRANCH"

          # Export to environment for subsequent sync steps
          echo "MANIFEST_BRANCH=${MANIFEST_BRANCH}" >> $GITHUB_ENV
          echo "ROOT_MANAGER=${{ inputs.root_manager }}" >> $GITHUB_ENV
          echo "MANIFEST_URL=https://android.googlesource.com/kernel/manifest" >> $GITHUB_ENV

          # 3. Route the variant to the appropriate build engine
          if [ "${{ inputs.build_channel }}" == "dynamic" ]; then
            echo ">>> Routing ${{ inputs.root_manager }} to Automated Dynamic Transplant..."
            echo "USE_DYNAMIC_TRANSPLANT=true" >> $GITHUB_ENV
            echo "SUSFS_REPO_URL=https://gitlab.com/simonpunk/susfs4ksu.git" >> $GITHUB_ENV
          else
            # Execute whatever else you have natively in your else block here
            echo ">>> Proceeding with standard build routing..."
          fi

      - name: Configure Build Channels
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          echo "=== Configuring Build Channel: ${{ inputs.build_channel }} ==="

          # 1. Define global upstream quirks based on the selected variant
          case "${{ inputs.root_manager }}" in
            "KernelSU-Next")
              echo "UPSTREAM_REPO=KernelSU-Next/KernelSU-Next" >> $GITHUB_ENV
              echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
              echo "WORKFLOW_FILE=build-manager-ci.yml" >> $GITHUB_ENV
              ;;
            "SukiSU-Ultra")
              echo "UPSTREAM_REPO=SukiSU-Ultra/SukiSU-Ultra" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV
              ;;
            "BakaSU")
              echo "UPSTREAM_REPO=Baka-SU/BakaSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV
              ;;
            "ReSukiSU")
              echo "UPSTREAM_REPO=ReSukiSU/ReSukiSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV
              ;;
            "KernelSU"|*)
              echo "UPSTREAM_REPO=tiann/KernelSU" >> $GITHUB_ENV
              echo "TARGET_BRANCH=main" >> $GITHUB_ENV
              echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV
              ;;
          esac

          # 2. Route the variant to the appropriate build engine
          if [ "${{ inputs.build_channel }}" == "dynamic" ]; then
            echo ">>> Routing ${{ inputs.root_manager }} to Automated Dynamic Transplant..."
            echo "USE_DYNAMIC_TRANSPLANT=true" >> $GITHUB_ENV
            echo "SUSFS_REPO_URL=https://gitlab.com/simonpunk/susfs4ksu.git" >> $GITHUB_ENV
          else
            echo ">>> Routing ${{ inputs.root_manager }} to Safe Fallback Fork (Stable branch)..."
            echo "USE_DYNAMIC_TRANSPLANT=false" >> $GITHUB_ENV
            echo "SUSFS_REPO_URL=https://gitlab.com/shoey63/susfs4ksu.git" >> $GITHUB_ENV
            echo "KSU_VARIANT_REPO_URL=https://github.com/shoey63/${{ inputs.root_manager }}.git" >> $GITHUB_ENV
            echo "KSU_VARIANT_REF=${{ inputs.build_channel }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync kernel source
        run: |
          set -euo pipefail
          rm -rf kernel_workspace && mkdir -p kernel_workspace && cd kernel_workspace
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo ">>> Running repo sync (Attempt $i of $MAX_RETRIES)..."
            
            if repo sync -c --no-tags --no-clone-bundle --current-branch -j$(nproc); then
              echo ">>> Repo sync successful!"
              break
            else
              if [ $i -eq $MAX_RETRIES ]; then
                echo ">>> Repo sync completely failed after $MAX_RETRIES attempts. Aborting."
                exit 1
              fi
              echo ">>> Sync connection dropped. Waiting 15 seconds before retrying..."
              sleep 15
            fi
          done

          # --- BULLETPROOF KERNEL ROOT FINDER ---
          # Tensor manifests hide the kernel in unpredictable directories.
          # This scans the workspace, finds the true source code, and symlinks it for legacy scripts.
          echo ">>> Scanning workspace for genuine kernel root..."
          REAL_ROOT=""
          for path in ./* ./*/*; do
              if [ -d "$path/drivers" ] && [ -f "$path/Makefile" ]; then
                  REAL_ROOT="$path"
                  break
              fi
          done
          
          if [ -n "$REAL_ROOT" ]; then
              echo ">>> True kernel root found at: $REAL_ROOT"
              if [ "$REAL_ROOT" != "./common" ] && [ "$REAL_ROOT" != "common" ] && [ "$REAL_ROOT" != "." ]; then
                  echo ">>> Bridging $REAL_ROOT to 'common'..."
                  rm -rf common || true
                  ln -s "${REAL_ROOT#./}" common
              fi
          else
              echo "[-] CRITICAL: Kernel tree not found in workspace!"
              ls -la
              exit 1
          fi

          # Capture the PURE Google hash AND the official Unix timestamp
          cd common
          echo "OFFICIAL_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OFFICIAL_DATE=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo ">>> Captured Hash: $(git rev-parse --short HEAD)"
          echo ">>> Captured Date: $(git log -1 --format=%ct)"

      - name: Calculate Dynamic SuSFS Branch
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          MANIFEST="${{ env.MANIFEST_BRANCH }}"

          if [[ -n "$MANIFEST" ]]; then
              echo ">>> Calculating SuSFS branch from manifest branch: $MANIFEST..."
              
              if [[ "$MANIFEST" == android-gs-* ]]; then
                  # Extract the base kernel version (e.g., 6.1)
                  BASE_VER=$(echo "$MANIFEST" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
                  
                  # Map Tensor kernels back to their corresponding generic SUSFS branches
                  if [ "$BASE_VER" == "5.10" ]; then SUSFS_BRANCH="gki-android12-5.10-dev"
                  elif [ "$BASE_VER" == "5.15" ]; then SUSFS_BRANCH="gki-android13-5.15-dev"
                  elif [ "$BASE_VER" == "6.1" ]; then SUSFS_BRANCH="gki-android14-6.1-dev"
                  elif [ "$BASE_VER" == "6.6" ]; then SUSFS_BRANCH="gki-android15-6.6-dev"
                  else SUSFS_BRANCH="gki-android14-6.1-dev"; fi
              else
                  # Standard common-* parsing
                  SUSFS_BRANCH=$(echo "$MANIFEST" | sed -E 's/common-(android[0-9]+-[0-9]+\.[0-9]+).*/gki-\1-dev/')
              fi
              
              echo ">>> Target SuSFS Branch mapped to: $SUSFS_BRANCH"
              echo "SUSFS_NEXT_REF=${SUSFS_BRANCH}" >> $GITHUB_ENV
              echo "SUSFS_BRANCH=${SUSFS_BRANCH}" >> $GITHUB_ENV
          else
              echo "[-] Warning: MANIFEST_BRANCH not found. Falling back to default."
              echo "SUSFS_BRANCH=gki-android14-6.1-dev" >> $GITHUB_ENV
              echo "SUSFS_NEXT_REF=gki-android14-6.1-dev" >> $GITHUB_ENV
          fi

      - name: Integrate Root Manager (${{ inputs.root_manager }})
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        env:
          KSU_VARIANT_REPO_URL: ${{ env.KSU_VARIANT_REPO_URL }}
          KSU_VARIANT_REF: ${{ env.KSU_VARIANT_REF }}
          USE_DYNAMIC_TRANSPLANT: ${{ env.USE_DYNAMIC_TRANSPLANT }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
          INTEGRATE_SUSFS: ${{ inputs.enable_ksu_susfs }}
          SUSFS_BRANCH: ${{ env.SUSFS_BRANCH }}
        run: |
          bash ./scripts/inject_ksu_variant.sh "${{ inputs.root_manager }}"

      - name: Integrate SUSFS common-side
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        env:
          SUSFS_NEXT_URL: ${{ env.SUSFS_REPO_URL }}
          SUSFS_NEXT_REF: ${{ env.SUSFS_BRANCH }}
        run: |
          bash ./scripts/integrate_susfs.sh

      - name: Fix SUSFS Patch Rejections
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          bash ./scripts/fix_susfs_rejections.sh

      - name: Configure Kconfigs and Fragments
        env:
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_NET_OPTS: ${{ inputs.enable_net_opts }}
          ENABLE_NETHUNTER: ${{ inputs.enable_nethunter }}
        run: |
          chmod +x scripts/configure_kconfigs.sh
          ./scripts/configure_kconfigs.sh

      - name: Inject User Source Files
        env:
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_NETHUNTER: ${{ inputs.enable_nethunter }}
        run: |
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            echo ">>> Fetching latest nomount source from master branch..."
            NOMOUNT_DIR="$(pwd)/tools/user_source/nomount/fs/nomount"
            
            # Fetch directly from the master branch
            curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/src/nomount.c" -o "$NOMOUNT_DIR/nomount.c"
            curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/src/nomount.h" -o "$NOMOUNT_DIR/nomount.h"
          fi

          echo ">>> Injecting active user source files into common tree..."
          cd kernel_workspace/common
          
          # 1. Base files (Root of tools/user_source) - FILES ONLY to avoid pulling inactive module folders
          [ -d "../../tools/user_source" ] && find ../../tools/user_source -maxdepth 1 -type f -exec cp -v {} . \;
          
          # 2. Module: NoMount
          if [ "$ENABLE_NOMOUNT" = "true" ] && [ -d "../../tools/user_source/nomount" ]; then
            echo "  -> Injecting NoMount source tree..."
            cp -r ../../tools/user_source/nomount/* . 2>/dev/null || true
          fi
          
          # 3. Module: NetHunter
          if [ "$ENABLE_NETHUNTER" = "true" ] && [ -d "../../tools/user_source/nethunter" ]; then
            echo "  -> Injecting NetHunter source tree..."
            cp -r ../../tools/user_source/nethunter/* . 2>/dev/null || true
          fi
          
          echo ">>> Source injection phase complete."
        shell: bash

      - name: Apply User Patches
        env:
          ENABLE_NET_OPTS: ${{ inputs.enable_net_opts }}
          ENABLE_NETHUNTER: ${{ inputs.enable_nethunter }}
        run: |
          echo ">>> Target Base Version for patches: $BASE_VER"
          cd kernel_workspace/common
          
          # Universal patch function to keep logic clean and scalable
          apply_patch_dir() {
            local pdir=$1
            if [ -d "$pdir" ]; then
              shopt -s nullglob
              local patches=("$pdir"/*.patch)
              if [ ${#patches[@]} -gt 0 ]; then
                echo ">>> Processing patches in $(basename "$pdir")..."
                for patch_file in "${patches[@]}"; do
                  local filename=$(basename "$patch_file")
                  if [[ "$filename" == "${BASE_VER}-"* ]]; then
                    echo "  -> [MATCH] Applying version-specific patch: $filename..."
                    patch -p1 --no-backup-if-mismatch < "$patch_file" || { echo "[-] Patch failed: $filename"; exit 1; }
                  elif [[ "$filename" =~ ^[0-9]+\.[0-9]+- ]]; then
                    continue
                  else
                    echo "  -> [GENERIC] Applying generic patch: $filename..."
                    patch -p1 --no-backup-if-mismatch < "$patch_file" || { echo "[-] Patch failed: $filename"; exit 1; }
                  fi
                done
              fi
              shopt -u nullglob
            fi
          }

          # 1. Root Patches (Always active)
          apply_patch_dir "../../tools/user_patches"
          
          # 2. Module: Network Optimizations
          if [ "$ENABLE_NET_OPTS" = "true" ]; then
            apply_patch_dir "../../tools/user_patches/net_opts"
          fi
          
          # 3. Module: NetHunter
          if [ "$ENABLE_NETHUNTER" = "true" ]; then
            apply_patch_dir "../../tools/user_patches/nethunter"
          fi
          
          echo ">>> Patching routine complete."
        shell: bash

      - name: Build common kernel Image
        env:
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_NET_OPTS: ${{ inputs.enable_net_opts }}
          ROOT_MANAGER: ${{ inputs.root_manager }}
          ENABLE_NETHUNTER: ${{ inputs.enable_nethunter }}
        run: |
          # --- KLEAF SYNTAX FIX ---
          # Newer Tensor branches changed the copy flag from destdir to dist_dir
          sed -i 's/--destdir=/--dist_dir=/g' scripts/build_kernel.sh

          # Injecting the REAL Google identity into the script session
          OFFICIAL_HASH=${{ env.OFFICIAL_HASH }} \
          OFFICIAL_DATE=${{ env.OFFICIAL_DATE }} \
          bash ./scripts/build_kernel.sh

      - name: Pull stock boot.img from OTA
        if: env.REPACK_ENABLED == 'true'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install git+https://github.com/shoey63/payload-dumper
          mkdir -p work/stock
          python3 ./scripts/ota_pull.py \
            --source "$OTA_URL" \
            --partition boot \
            --outdir work/stock
          echo ">>> Pulled stock boot image(s)"
          find work/stock -maxdepth 1 -type f \( -name 'boot.img' -o -name 'boot-*.img' \) -ls

      - name: Repack boot image with built Image
        if: env.REPACK_ENABLED == 'true'
        run: |
          mkdir -p out/final
          mkdir -p work/repack-tmp
          chmod +x ./tools/magiskboot || true

          BOOT_IMG="$(find work/stock -maxdepth 1 -type f \( -name 'boot.img' -o -name 'boot-*.img' \) | head -n 1)"
          [ -n "$BOOT_IMG" ] || { echo "[-] Could not find stock boot image"; exit 1; }

          STOCK_NAME="$(basename "$BOOT_IMG" .img)"

          bash ./scripts/boot_swap.sh \
            --boot "$BOOT_IMG" \
            --image "out/Image" \
            --magiskboot "./tools/magiskboot" \
            --outdir "out/final" \
            --outname "${STOCK_NAME}-repacked.img" \
            --workdir "work/repack-tmp"

      - name: Prepare Final Artifacts
        run: |
          mkdir -p out/final
          echo -e "MANIFEST_URL=${MANIFEST_URL}\nMANIFEST_BRANCH=${MANIFEST_BRANCH}\nOTA_URL=${OTA_URL}\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > out/final/repack_metadata.txt

          # Sanitize inputs.build_name: replace spaces and slashes with underscores
          SAFE_BUILD_NAME=$(echo "${{ inputs.build_name }}" | tr ' /' '__')

          AK3_REPO="https://github.com/shoey63/AnyKernel3.git"
          AK3_BRANCH="master"

          if [ "$REPACK_ENABLED" != "true" ]; then
            echo ">>> No OTA provided. Falling back to AnyKernel3 Zip generation..."

            # Prepend root manager to the standalone AK3 artifact name
            echo "ARTIFACT_NAME=${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3" >> $GITHUB_ENV

            git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3-Builder
            rm -rf AnyKernel3-Builder/.git AnyKernel3-Builder/README.md AnyKernel3-Builder/*placeholder
            cp -f out/Image AnyKernel3-Builder/
            cp -r AnyKernel3-Builder/* out/final/

          else
            echo ">>> OTA Repack detected. Outputting standard boot image and AK3 zip."
            # Use the sanitized name for the parent artifact zip
            echo "ARTIFACT_NAME=${SAFE_BUILD_NAME}" >> $GITHUB_ENV

            # Generate the specific AK3 zip for inclusion in the artifact
            git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3-Builder
            rm -rf AnyKernel3-Builder/.git AnyKernel3-Builder/README.md AnyKernel3-Builder/*placeholder
            cp -f out/Image AnyKernel3-Builder/

            # Zip the AK3 payload explicitly into out/final/ with root manager prepended
            cd AnyKernel3-Builder
            zip -r9 "../out/final/${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3.zip" *
            cd ..
          fi

          echo ">>> Final Artifact Directory:"
          ls -lah out/final/

      - name: Build NetHunter KernelSU Module
        run: |
          echo ">>> Staging compiled wireless modules..."
          mkdir -p /tmp/kmod_staging
          
          # 1. Sanitize the build name (converts spaces/slashes to a single underscore)
          SAFE_BUILD_NAME=$(echo "${{ inputs.build_name }}" | tr ' /' '_' | tr -s '_')
          echo "SAFE_BUILD_NAME=${SAFE_BUILD_NAME}" >> $GITHUB_ENV

          # 2. Define the target driver patterns
          MODULE_PATTERNS=(
              # MediaTek ALFA AWUS036ACM Drivers
              "mt76.ko"
              "mt76-usb.ko"
              "mt76x02-lib.ko"
              "mt76x02-usb.ko"
              "mt76x2-common.ko"
              "mt76x2u.ko"
          )

          # 3. Find and copy them EXCLUSIVELY from the compiled Bazel output directory
          echo ">>> Searching for stripped modules in kernel_workspace/out/dist/ ..."
          for pattern in "${MODULE_PATTERNS[@]}"; do
            if [[ "$pattern" == *"/"* ]]; then
              find kernel_workspace/out/dist/ -path "$pattern" -type f -exec cp {} /tmp/kmod_staging/ \;
            else
              find kernel_workspace/out/dist/ -name "$pattern" -type f -exec cp {} /tmp/kmod_staging/ \;
            fi
          done

          # 4. FAIL-SAFE: Check if any .ko files were actually found
          KO_COUNT=$(ls -1 /tmp/kmod_staging/*.ko 2>/dev/null | wc -l)
          if [ "$KO_COUNT" -eq 0 ]; then
            echo ">>> No NetHunter .ko files found. Skipping NetHunter Module creation."
            echo "HAS_NETHUNTER=false" >> $GITHUB_ENV
            exit 0
          fi
          
          echo ">>> Successfully staged $KO_COUNT modules!"
          echo "HAS_NETHUNTER=true" >> $GITHUB_ENV
          
          chmod +x scripts/build_nethunter_module.sh
          echo ">>> Executing build_nethunter_module.sh..."
          ./scripts/build_nethunter_module.sh "/tmp/kmod_staging" "$SAFE_BUILD_NAME"

      - name: Upload NetHunter Module Artifact
        if: env.HAS_NETHUNTER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_BUILD_NAME }}-NetHunter-Module
          path: ksu_nethunter_module/
          if-no-files-found: error

      - name: Fetch Matching Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        id: fetch_manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ inputs.root_manager }}
          UPSTREAM_HASH: ${{ env.UPSTREAM_HASH }}
        run: |
          chmod +x scripts/fetch_manager.sh
          ./scripts/fetch_manager.sh "$VARIANT" "$GH_TOKEN" "$UPSTREAM_HASH"

      - name: Upload final artifact (Kernel)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/final/
          if-no-files-found: error
          
      - name: Fetch NoMount KernelSU Module
        if: inputs.enable_nomount == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> Fetching latest stable NoMount release module..."
          mkdir -p nomount_extracted
          
          # 1. Query GitHub API for the latest release
          RELEASE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/maxsteeel/nomount/releases/latest")
          
          # 2. Extract the browser_download_url for the zip asset
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          
          if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
            echo "  -> Found latest release artifact. Downloading from: $DOWNLOAD_URL"
            curl -sL -o temp_module.zip "$DOWNLOAD_URL"
            
            echo "  -> Extracting module..."
            unzip -q temp_module.zip -d nomount_extracted/
            rm temp_module.zip
            echo "  -> Success! Extracted contents:"
            ls -la nomount_extracted/
          else
            echo "[-] Failed to find a valid zip artifact in the latest release."
            exit 1
          fi
        shell: bash

      - name: Upload NoMount Module
        if: inputs.enable_nomount == true
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-KSU-Module
          path: nomount_extracted/
          if-no-files-found: warn

      - name: Upload Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.root_manager }}-Manager
          path: manager_apk/*.apk
          if-no-files-found: error
